<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Flask App</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: #f3f6fb; color: #172033; }
    main { max-width: 620px; margin: 24px; padding: 36px; background: white;
           border-radius: 18px; box-shadow: 0 12px 36px #18294a18; }
    h1 { margin-top: 0; }
    p { line-height: 1.6; color: #4b5870; }
    code { background: #eef2f8; padding: 3px 7px; border-radius: 6px; }
    .status { display: inline-block; padding: 8px 12px; border-radius: 999px;
              background: #e4f8ec; color: #176b3a; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <span class="status">Flask is running</span>
    <h1>Hello, DevOps learner!</h1>
    <p>Your Flask web application is serving this page. You can use it to practise
       Python, HTTP routes, Docker port mapping, and reverse-proxying with Nginx.</p>
    <p>Health-check endpoint: <code>/health</code></p>
  </main>
</body>
</html>
